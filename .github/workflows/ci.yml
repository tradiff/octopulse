name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise toolchain
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: npm ci

      - name: Install browser and desktop test dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y dbus-daemon
          command -v dbus-run-session

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run check

      - name: Build project
        run: npm run build

      - name: Build Linux package
        run: npm run package

      - name: Verify packaged runtime and installation
        run: npm run check:package -- release/octopulse-*-linux-x64-glibc.tar.gz
